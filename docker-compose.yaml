services:
  api:
    container_name: nextbot_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
      - postgres
    ports:
      - 8080:8080
    volumes:
      - nextbot_instances:/nextbot/instances
    networks:
      - nextbot-net
    env_file:
      - .env
    expose:
      - 8080

  redis:
    image: redis:latest
    networks:
      - nextbot-net
    container_name: redis
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - nextbot_redis:/data
    ports:
      - 6379:6379

  postgres:
    container_name: postgres
    image: postgres:15
    networks:
      - nextbot-net
    command: ["postgres", "-c", "max_connections=1000", "-c", "listen_addresses=*"]
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=nextbot
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - 5432

volumes:
  nextbot_instances:
  nextbot_redis:
  postgres_data:


networks:
  nextbot-net:
    name: nextbot-net
    driver: bridge
